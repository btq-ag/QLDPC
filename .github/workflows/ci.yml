name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check qldpc/ tests/

      - name: Type check with mypy
        run: |
          mypy qldpc/__init__.py qldpc/codes.py qldpc/decoders.py qldpc/noise.py qldpc/processor.py qldpc/config.py qldpc/theme.py qldpc/simulation/monte_carlo.py --ignore-missing-imports

      - name: Run tests
        run: |
          xvfb-run -a pytest tests/ -v --tb=short --cov=qldpc --cov-report=term-missing

  test-quantum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install package with Qiskit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[quantum,dev]"

      - name: Run tests
        run: |
          xvfb-run -a pytest tests/ -v --tb=short --cov=qldpc --cov-report=term-missing
