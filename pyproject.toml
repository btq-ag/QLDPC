[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qldpc"
version = "1.0.0"
description = "Interactive Python toolkit for quantum LDPC error correction: 3D circuit builder, real-time belief propagation simulation, and threshold analysis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jeffrey Morais" }
]
keywords = [
    "quantum-computing",
    "quantum-error-correction",
    "ldpc-codes",
    "surface-codes",
    "circuit-builder",
    "interactive-visualization",
    "tanner-graph",
    "belief-propagation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "networkx>=2.6",
]

[project.optional-dependencies]
quantum = [
    "qiskit>=0.45",
    "qiskit-aer>=0.12",
]
decoders = [
    "pymatching>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/btq-ag/QLDPC"
Repository = "https://github.com/btq-ag/QLDPC"
Issues = "https://github.com/btq-ag/QLDPC/issues"

[project.scripts]
qldpc-builder = "qldpc.builder.app:main"
qldpc-simulator = "qldpc.simulation.ldpc_circuit:main"
qldpc-tanner = "qldpc.tanner.graph_3d:main"
qldpc-threshold = "qldpc.tanner.threshold_3d:main"

[tool.setuptools.packages.find]
include = ["qldpc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = [
    "E501",   # line too long — handled separately
    "N806",   # camelCase variables in functions — intentional policy
    "N816",   # mixed-case globals — intentional policy
    "N803",   # camelCase arguments — intentional policy
    "N802",   # camelCase function names — intentional policy
    "E741",   # ambiguous variable name — false positives in list comprehensions
]

[tool.ruff.lint.per-file-ignores]
"qldpc/builder/app.py" = ["E402", "F401"]
"qldpc/simulation/animations.py" = ["E402"]
"qldpc/simulation/cavity_gates.py" = ["E402"]
"qldpc/simulation/ghz.py" = ["E402"]
"qldpc/simulation/quantum_circuits.py" = ["E402", "F401"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = [
    "tests/",
    "docs/",
    "qldpc/builder/",
    "qldpc/simulation/quantum_circuits\\.py",
    "qldpc/simulation/syndrome\\.py",
    "qldpc/tanner/graph_3d\\.py",
]

# Graduated strictness: new modules should meet this bar.
# Existing modules are exempted below — fix incrementally, not all at once.
warn_return_any = false
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["qldpc.builder.*", "qldpc.simulation.*", "qldpc.tanner.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.coverage.run]
source = ["qldpc"]
omit = [
    "qldpc/builder/app.py",
    "qldpc/builder/ui/*",
    "qldpc/builder/renderers/*",
    "qldpc/simulation/animations.py",
    "qldpc/simulation/cavity_gates.py",
    "qldpc/simulation/ghz.py",
    "qldpc/simulation/quantum_circuits.py",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
